[project]
name = "fitness-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "duckdb>=1.1",
  "pytz>=2024.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fitness",
]

[tool.uv.sources]
fitness = { path = "../zepp-importer", editable = true }

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
